[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "avtomatika-full-example"
version = "1.0b26"
description = "Comprehensive example for Avtomatika HLN Orchestrator"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "avtomatika[all]>=1.0b26",
    "avtomatika-worker[pydantic]>=1.0b17",
    "rxon>=1.0b13",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*.py"]
